        { id: 97, q: "‘PM-KISAN’ প্রকল্পের প্রধান সুবিধাভোগী কারা?", options: ["A) ছাত্রছাত্রী", "B) কৃষক", "C) সরকারি কর্মচারী", "D) ক্ষুদ্র ব্যবসায়ী"], ans: "B" },
        { id: 98, q: "‘Beti Bachao Beti Padhao’ প্রকল্পের প্রধান উদ্দেশ্য কী?", options: ["A) নারী ও কন্যাশিশুর কল্যাণ", "B) কৃষি উন্নয়ন", "C) শিল্প উন্নয়ন", "D) গ্রামীণ সড়ক নির্মাণ"], ans: "A" },
        { id: 99, q: "Thomas Cup কোন খেলার সঙ্গে সম্পর্কিত?", options: ["A) Tennis", "B) Badminton", "C) Hockey", "D) Table Tennis"], ans: "B" },
        { id: 100, q: "‘Ranji Trophy’ কোন খেলার সঙ্গে সম্পর্কিত?", options: ["A) Football", "B) Basketball", "C) Hockey", "D) Cricket"], ans: "D" }
    ];

    let timerInterval;
    let studentDetails = { name: "", phone: "" };

    function startTest() {
        const name = document.getElementById("student-name").value.trim();
        const phone = document.getElementById("student-phone").value.trim();
        const errorMsg = document.getElementById("login-error");

        if (!name || !phone) {
            errorMsg.innerText = "Please fill in all details.";
            return;
        }

        if (!allowedPhoneNumbers.includes(phone)) {
            errorMsg.innerText = "Phone number not authorized for this mock test.";
            return;
        }

        // Single attempt check via LocalStorage
        if (localStorage.getItem("attempted_" + phone)) {
            errorMsg.innerText = "You have already attempted this mock test once.";
            return;
        }

        studentDetails.name = name;
        studentDetails.phone = phone;

        document.getElementById("login-section").classList.add("hidden");
        document.getElementById("exam-section").classList.remove("hidden");
        document.getElementById("timer").classList.remove("hidden");

        renderQuestions();
        startTimer(90 * 60); // 90 minutes
    }

    function renderQuestions() {
        const container = document.getElementById("questions-container");
        container.innerHTML = "";

        questionsData.forEach((q, index) => {
            const qDiv = document.createElement("div");
            qDiv.className = "question-card";
            
            let optionsHTML = "";
            q.options.forEach((opt, optIdx) => {
                const optVal = String.fromCharCode(65 + optIdx); // A, B, C, D
                optionsHTML += `
                    <label>
                        <input type="radio" name="q${q.id}" value="${optVal}">
                        ${opt}
                    </label>
                `;
            });

            qDiv.innerHTML = `
                <p><strong>Q${index + 1}. ${q.q}</strong></p>
                <div class="options">${optionsHTML}</div>
            `;
            container.appendChild(qDiv);
        });
    }

    function startTimer(duration) {
        let timer = duration, minutes, seconds;
        const display = document.getElementById("time-display");
        
        timerInterval = setInterval(() => {
            minutes = parseInt(timer / 60, 10);
            seconds = parseInt(timer % 60, 10);

            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            display.textContent = minutes + ":" + seconds;

            if (--timer < 0) {
                clearInterval(timerInterval);
                alert("Time is up! Submitting test.");
                submitTest();
            }
        }, 1000);
    }

    function submitTest() {
    clearInterval(timerInterval);
    document.getElementById("timer").classList.add("hidden");
    document.getElementById("exam-section").classList.add("hidden");
    document.getElementById("result-section").classList.remove("hidden");

    // Mark as attempted in LocalStorage
    localStorage.setItem("attempted_" + studentDetails.phone, "true");

    let correct = 0;
    let wrong = 0;
    let unattempted = 0;

    let previewHTML = "<h3 style='text-align: center;'>Detailed Review & Answer Key</h3>";

    questionsData.forEach((q, index) => {
        const selectedOption = document.querySelector(`input[name="q${q.id}"]:checked`);
        const userAns = selectedOption ? selectedOption.value : null;

        let statusText = "";
        if (!userAns) {
            unattempted++;
            statusText = `<span class="unattempted" style="color: orange; font-weight: bold;">Unattempted (0)</span>`;
        } else if (userAns === q.ans) {
            correct++;
            statusText = `<span class="correct" style="color: green; font-weight: bold;">Correct (+2)</span>`;
        } else {
            wrong++;
            statusText = `<span class="wrong" style="color: red; font-weight: bold;">Wrong (-0.5)</span>`;
        }

        // Render all 4 options for full review
        let optionsListHTML = "<div style='margin-left: 15px; margin-top: 5px;'>";
        q.options.forEach((opt, optIdx) => {
            const optLetter = String.fromCharCode(65 + optIdx);
            let optStyle = "color: #333;";

            // Highlight correct answer in green and wrong user choice in red
            if (optLetter === q.ans) {
                optStyle = "color: green; font-weight: bold;";
            } else if (optLetter === userAns && userAns !== q.ans) {
                optStyle = "color: red; text-decoration: line-through;";
            }

            optionsListHTML += `<div style="${optStyle}">${opt}</div>`;
        });
        optionsListHTML += "</div>";

        previewHTML += `
            <div class="question-card" style="margin-bottom: 15px; padding: 10px; border-bottom: 1px solid #ccc; page-break-inside: avoid;">
                <p><strong>Q${index + 1}. ${q.q}</strong> — Status: ${statusText}</p>
                ${optionsListHTML}
                <p style="margin-top: 8px; font-size: 14px;">
                    <strong>Your Choice:</strong> ${userAns ? userAns : "None"} | 
                    <strong>Correct Answer:</strong> <span style="color: green; font-weight: bold;">${q.ans}</span>
                </p>
            </div>
        `;
    });

    const totalScore = (correct * 2) - (wrong * 0.5);

    document.getElementById("result-summary").innerHTML = `
        <p><strong>Name:</strong> ${studentDetails.name}</p>
        <p><strong>Phone:</strong> ${studentDetails.phone}</p>
        <p><strong>Correct Answers:</strong> ${correct}</p>
        <p><strong>Wrong Answers:</strong> ${wrong}</p>
        <p><strong>Unattempted:</strong> ${unattempted}</p>
        <p><strong>Final Score:</strong> ${totalScore} / 200</p>
    `;

    document.getElementById("preview-container").innerHTML = previewHTML;

    // Send results to external services
    saveToGoogleSheet(studentDetails.name, studentDetails.phone, totalScore, correct, wrong, unattempted);
    saveToFirebase(studentDetails.name, studentDetails.phone, totalScore, correct, wrong, unattempted);
}

function downloadPDF() {
    const element = document.getElementById("result-section");
    
    // Configuration to format multi-page 100-question PDF cleanly
    const opt = {
        margin:       [10, 10, 10, 10],
        filename:     `${studentDetails.name}_Mock_Test_Result.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
    };
    
    html2pdf().set(opt).from(element).save();
}
